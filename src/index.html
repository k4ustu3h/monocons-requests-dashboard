<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Browse and download community icon requests for Monocons."
    />
    <link rel="canonical" href="/" />

    <meta property="og:title" content="Monocons Requests Dashboard" />
    <meta
      property="og:description"
      content="Browse and download community icon requests for Monocons."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./favicon.svg" />
    <meta property="og:url" content="/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Monocons Requests Dashboard" />
    <meta
      name="twitter:description"
      content="Browse and download community icon requests for Monocons."
    />
    <meta name="twitter:image" content="./favicon.svg" />

    <title>Monocons Requests Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="page">
      <!-- HEADER -->
      <header class="header">
        <div class="header-left">
          <img
            src="./favicon.svg"
            alt="Monocons"
            class="header-icon"
          />
          <div class="header-info">
            <h1>Monocons</h1>
            <div id="headerCount" class="header-sub"></div>
          </div>
        </div>
        <div class="header-center">
          <div
            class="input-wrapper"
            id="search-wrapper"
            title="Search"
          >
            <div class="input-icon">
              <svg id="searchIcon">
                <use href="#ic-search" />
              </svg>
            </div>
            <input
              id="searchInput"
              placeholder="Search apps and IDs"
            />
            <button
              id="clearSearchBtn"
              class="input-icon is-hidden"
              title="Clear search"
            >
              <svg>
                <use href="#ic-close" />
              </svg>
            </button>
            <button
              id="regexBtn"
              class="input-icon"
              title="Use regular expression"
            >
              <svg>
                <use href="#ic-regex" />
              </svg>
            </button>
          </div>
          <span class="header-link-wrapper is-hidden">
            <button
              id="lowQualityBtn"
              class="header-link"
              title="Low quality icons"
            >
              <svg>
                <use href="#ic-low-quality-icons" />
              </svg>
            </button>
            <span
              class="contribution-count-badge"
              id="lowQualityCountBadge"
            ></span>
          </span>
          <span class="header-link-wrapper">
            <button
              id="contributionBtn"
              class="header-link"
              title="Contribution plan"
            >
              <svg>
                <use href="#ic-contribution-plan" />
              </svg>
            </button>
            <span
              class="contribution-count-badge"
              id="contributionCountBadge"
            ></span>
          </span>
        </div>
        <div class="header-right">
          <a
            href="https://github.com/LawnchairLauncher/lawnchair"
            class="header-link"
            title="Lawnchair on GitHub"
          >
            <svg>
              <use href="#ic-lawnchair"></use>
            </svg>
          </a>
          <a
            href="https://github.com/k4ustu3h/monocons"
            class="header-link"
            title="Monocons on GitHub"
          >
            <svg>
              <use href="#ic-monocons"></use>
            </svg>
          </a>
        </div>
      </header>

      <div class="cards-row">
        <div id="mainCards" style="display: contents">
          <div id="supportedCard" class="card">
            <div class="card-header">
              <span class="status-pill status-supported"
              >Supported</span>
              <span class="card-sub" id="supportedSub"></span>
            </div>
            <div class="card-sub is-hidden" id="supportedDesc">
							Get higher priority for your icon request.
						</div>
            <a
              href="https://github.com/k4ustu3h/monocons#supporting"
              target="_blank"
              rel="noopener"
              class="link is-hidden"
              id="supportedLink"
            >Become a supporter</a>
          </div>

          <div id="quickPickCard" class="card">
            <div class="quick-pick-actions">
              <div class="quick-pick-actions-bg">
                <span title="Easy">
                  <svg
                    id="quickPickEasy"
                    class="active"
                    data-action="quick-pick-mode"
                    data-mode="easy"
                  >
                    <use href="#ic-easy" />
                  </svg>
                </span>
                <span title="Middle+">
                  <svg
                    id="quickPickAll"
                    data-action="quick-pick-mode"
                    data-mode="middle"
                  >
                    <use href="#ic-middle-plus" />
                  </svg>
                </span>
                <a
                  id="quickPickDownload"
                  class="quick-pick-btn-icon"
                  href="#"
                  title="Download zip archive"
                >
                  <svg>
                    <use href="#ic-download" />
                  </svg>
                </a>
              </div>
            </div>
          </div>

          <div id="activityCard" class="card">
            <div class="card-header">
              <span class="card-title">Activity</span>
              <span class="card-sub" id="activitySub"
              >new • done</span>
            </div>
            <div id="activityChart" class="domain-stats"></div>
          </div>

          <div id="domainStatsCard" class="card">
            <div class="card-header">
              <span class="card-title">Top domains</span>
              <span
                title="Top domains: countries with the most requests overall."
              >
                <svg
                  id="domainStatsMostRequested"
                  class="active"
                  data-action="domain-stats-mode"
                  data-mode="requests"
                >
                  <use href="#ic-most-requested" />
                </svg>
              </span>
              <span
                title="Local impact: countries where the most requested apps matter most to locals."
              >
                <svg
                  id="domainStatsLocalImpact"
                  data-action="domain-stats-mode"
                  data-mode="local"
                >
                  <use href="#ic-local-impact" />
                </svg>
              </span>
              <span
                title="Lowest coverage: countries with the largest request backlog."
              >
                <svg
                  id="domainStatsLowestCoverage"
                  data-action="domain-stats-mode"
                  data-mode="coverage"
                >
                  <use href="#ic-lowest-coverage" />
                </svg>
              </span>
            </div>
            <div id="domainStats" class="domain-stats"></div>
          </div>
        </div>
      </div>

      <div id="iconLibraryResults" class="icon-library-results is-hidden">
        <div class="library-header">
          <span class="library-title"></span>
        </div>
        <div class="library-grid"></div>
      </div>

      <div class="tabs" id="mainTabs">
        <button class="tab active" data-tab="requests">
					Community requests
				</button>
        <button class="tab" data-tab="screens">Screens</button>
      </div>
      <button
        id="screenSortBtn"
        class="chip is-hidden"
        title="Sort screens"
      >
        <span id="screenSortLabel">Most requested</span>
      </button>

      <div class="controls">
        <a href="#headerCheck" id="controlsSkip">Skip filters</a>

        <div class="controls-bottom">
          <div class="control-group">
            <button
              id="viewBtn"
              class="control-group-btn"
              title="List or grid view"
            >
              <svg id="viewIconList" class="active">
                <use href="#ic-list-view" />
              </svg>
              <svg id="viewIconGrid">
                <use href="#ic-grid-view" />
              </svg>
            </button>
            <button id="sortBtn" class="chip" title="Sort by">
              <span id="sortLabel">Most requested</span>
            </button>
          </div>

          <div
            class="filter-tags desktop-only"
            id="filterContainer"
          ></div>
          <button
            id="mobileFilterBtn"
            class="filter-btn mobile-only chip"
            title="Filter apps"
          >
            <span>Filters</span>
            <span id="mobileFilterCount"></span>
          </button>
        </div>
      </div>

      <!-- SELECTION BAR (Fixed Bottom Card) -->
      <div id="selectionBar" class="selection-bar">
        <div class="sb-main">
          <div class="sb-count" id="sbCount">0 icons</div>
          <button
            class="sb-clear-btn"
            id="sbHint"
            title="[Esc] Clear selection"
          >
            <svg>
              <use href="#ic-esc" />
            </svg>
          </button>
        </div>
        <div class="sb-actions">
          <button
            class="sb-action-btn"
            id="sbContributeBtn"
            title="Add to contribution plan"
          >
            <svg>
              <use href="#ic-add-to-plan" />
            </svg>
            <span>Add to plan</span>
          </button>
          <button
            class="sb-action-btn sb-action-btn-icon"
            id="sbDownloadBtn"
            title="Download zip archive"
          >
            <svg>
              <use href="#ic-download" />
            </svg>
          </button>
          <button
            class="sb-action-btn sb-action-btn-icon"
            id="sbMenuBtn"
            title="Download options"
          >
            <svg>
              <use href="#ic-more" />
            </svg>
          </button>
        </div>
        <div
          id="sbMenu"
          popover="auto"
          class="context-menu row-style"
        ></div>
      </div>

      <div class="list-viewport">
        <div id="listHeader" class="list-header">
          <div class="col sel">
            <input type="checkbox" id="headerCheck" />
          </div>
          <div class="col icon">Icon</div>
          <div class="col name">Name</div>
          <div class="col req">Requests</div>
          <div class="col install">Installs</div>
          <div class="col first">First time</div>
          <div class="col actions">Actions</div>
        </div>
        <div id="appContainer"></div>
        <div id="scrollSentinel">
          <svg width="48" height="48">
            <use href="#ic-scroller"></use>
          </svg>
        </div>
      </div>
    </div>

    <div id="sortMenu" popover="auto" class="context-menu row-style"></div>
    <div id="viewMenu" popover="auto" class="context-menu row-style"></div>
    <div
      id="rowMenu"
      popover="auto"
      tabindex="0"
      role="menu"
      class="context-menu row-style"
    ></div>
    <div
      id="mobileFilterMenu"
      popover="auto"
      tabindex="0"
      role="menu"
      class="context-menu row-style mobile-filter-style"
    ></div>
    <div id="toastContainer" class="toast-container"></div>

    <script
      src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
    <script src="script.js"></script>
