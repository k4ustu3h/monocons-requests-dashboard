name: Remove Fulfilled Requests

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Remove added requests
        id: remove_requests
        run: python scripts/remove_added_requests.py
      
      - name: Auto generate tags
        if: steps.remove_requests.outputs.appfilter_changed == 'true'
        run: python scripts/generate_auto_tags.py src/assets/requests.json src/assets/filters src/assets/appfilter.xml

      - name: Commit and push changes
        if: steps.remove_requests.outputs.appfilter_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Remove fulfilled requests" && git push)
