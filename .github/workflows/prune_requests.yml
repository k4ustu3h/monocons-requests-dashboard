name: Prune Requests

on:
  schedule:
    - cron: "17 1 * * *"
      timezone: Europe/Moscow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests google-play-scraper lxml Pillow svgelements

      - name: Fetch new emails
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/fetch_emails.py

      - name: Parse emails
        id: parse_emails
        run: |
          if [ "$(ls -A emails/ 2>/dev/null)" ]; then
            echo "Y" | python scripts/email_parser.py emails/ src/assets/appfilter.xml src/extracted_images src/assets
            echo "emails_parsed=true" >> $GITHUB_OUTPUT
          else
            echo "No emails to parse."
            echo "emails_parsed=false" >> $GITHUB_OUTPUT
          fi

      - name: Save trending baseline
        run: python scripts/save_trending_baseline.py

      - name: Prune requests
        id: prune_requests
        run: python scripts/prune_requests.py

      - name: Auto generate tags
        if: steps.prune_requests.outputs.appfilter_changed == 'true'
        run: python scripts/generate_auto_tags.py src/assets/requests.json src/assets/filters src/assets/appfilter.xml

      - name: Clone Monocons SVGs
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/k4ustu3h/monocons-android.git monocons-temp
          cd monocons-temp
          git sparse-checkout set svgs
          cd ..
          mkdir -p src/assets/qa_issues/svgs
          cp -r monocons-temp/svgs/* src/assets/qa_issues/svgs/
          rm -rf monocons-temp

      - name: Run incremental review
        run: python scripts/incremental_review.py

      - name: Commit and push changes
        if: steps.parse_emails.outputs.emails_parsed == 'true' || steps.prune_requests.outputs.requests_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          EMAILS_PARSED="${{ steps.parse_emails.outputs.emails_parsed }}"
          PRUNED="${{ steps.prune_requests.outputs.requests_changed }}"

          # Determine the commit message based on which steps succeeded
          if [ "$EMAILS_PARSED" == "true" ] && [ "$PRUNED" == "true" ]; then
            COMMIT_MSG="Update requests, and prune fulfilled and outdated requests"
          elif [ "$EMAILS_PARSED" == "true" ]; then
            COMMIT_MSG="Update requests"
          elif [ "$PRUNED" == "true" ]; then
            COMMIT_MSG="Prune fulfilled and outdated requests"
          else
            COMMIT_MSG="Update dashboard data"
          fi

          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "$COMMIT_MSG" && git push)
